baseURL      = "https://yager.me/"
languageCode = "en-us"
title        = "Eric Yager"
minVersion   = "0.115.0"
disableKinds = ["taxonomy", "term"]

[params]
  description     = "Eric Yager's personal link sharing page"
  googleAnalytics = "" 
  background      = ["lava", "fireflies"]  # bubbles | lava | murmuration | birds | fireflies | none | random
                                # or a subset to pick from, e.g. ["lava", "birds"]

[outputs]
  home = ["HTML"]

# Theme, imported with explicit mounts so only its stylesheet is published
# (its demo images, favicons, and script.js are unused).
[[module.imports]]
  path = "LucentLink-Hugo"
  [[module.imports.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.imports.mounts]]
    source = "static"
    target = "static"
    includeFiles = "css/style.css"
