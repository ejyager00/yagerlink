baseURL      = "https://yager.me/"
languageCode = "en-us"
title        = "Eric Yager"
minVersion   = "0.115.0"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true   # layouts/robots.txt

[params]
  description     = "Eric Yager's personal link sharing page"
  googleAnalytics = "" 
  background      = ["lava", "fireflies"]  # bubbles | lava | murmuration | birds | fireflies | none | random
                                # or a subset to pick from, e.g. ["lava", "birds"]

[outputs]
  home = ["HTML"]

# Theme, imported with explicit mounts: only its stylesheet is used, mounted into
# assets/ so it's bundled with the site CSS (its demo images, favicons, and
# script.js are not published).
[[module.imports]]
  path = "LucentLink-Hugo"
  [[module.imports.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.imports.mounts]]
    source = "static"
    target = "assets"
    files  = ["css/style.css"]
