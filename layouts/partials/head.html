<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Title }}</title>
    {{- $title := .Params.name | default .Site.Title }}
    {{- $desc := .Params.description | default .Site.Params.description }}

    <meta name="title" content="{{ $title }}" />
    <meta name="description" content="{{ $desc }}" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:title" content="{{ $title }}" />
    <meta property="og:description" content="{{ $desc }}" />
    {{- with .Params.profileImage }}
    <meta property="og:image" content="{{ replaceRE "^/" "" . | absURL }}" />
    {{- end }}

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ $title }}" />
    <meta name="twitter:description" content="{{ $desc }}" />
    {{- with .Params.profileImage }}
    <meta name="twitter:image" content="{{ replaceRE "^/" "" . | absURL }}" />
    {{- end }}

    <link rel="stylesheet" href="css/style.css">
    {{ $tailwind := resources.Get "css/tailwind.css" | postCSS }}
    <link rel="stylesheet" href="{{ $tailwind.RelPermalink }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="css/customstyle.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
