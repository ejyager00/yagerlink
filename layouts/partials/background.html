{{- /* Animated background; mode(s) from params.background in hugo.toml */}}
{{- $bg := site.Params.background | default "bubbles" }}
{{- if reflect.IsSlice $bg }}{{ $bg = delimit $bg "," }}{{ end }}
<div class="bg-animation" id="bgAnimation" data-bg="{{ $bg }}"></div>
<script src="/js/background.js" defer></script>
